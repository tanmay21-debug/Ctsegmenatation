[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ctseg-starter"
version = "0.1.0"
description = "Modular CPU-first 2D/3D CT segmentation toolkit"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24", "scipy>=1.10", "scikit-image>=0.22",
  "scikit-learn>=1.3", "tifffile>=2023.7", "matplotlib>=3.7", "psutil>=5.9"
]

[project.scripts]
ctseg = "ctseg.cli:main"

[tool.setuptools.packages.find]
include = ["ctseg*"]
